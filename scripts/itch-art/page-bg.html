<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OnePixel page background</title>
    <style>
      html, body { margin: 0; background: #111111; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      // itch.io page background, tiled: the arena's LED dot matrix, dimmed so
      // it sits behind the page without competing with it. Rendered at 1x so
      // the dots keep the game's 10px spacing when tiled.
      import { setup, done } from './art.js'

      const { ctx, w, h, rng } = await setup()
      ctx.fillStyle = '#111111'
      ctx.fillRect(0, 0, w, h)
      const spacing = 10
      for (let y = spacing / 2; y < h; y += spacing) {
        for (let x = spacing / 2; x < w; x += spacing) {
          // Mostly faint dots with the odd brighter one, like the idle arena.
          const bright = rng.next() < 0.08
          const a = bright ? 0.22 + rng.next() * 0.12 : 0.1 + rng.next() * 0.06
          const r = bright ? 1.3 : 1
          ctx.fillStyle = `rgba(122,122,122,${a.toFixed(3)})`
          ctx.beginPath()
          ctx.arc(x, y, r, 0, Math.PI * 2)
          ctx.fill()
        }
      }
      done()
    </script>
  </body>
</html>
